[workspace]
resolver = "3"
members = [".", "adapters/discord", "adapters/onebot"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[package]
name = "asanagi"
description = "Platform-agnostic chatting app bot framework"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
async-trait = "0.1"
tokio = { version = "1.53.2", features = ["full"] }

[workspace.dependencies]
async-trait = "0.1"
serde_json = "1"
tokio = { version = "1.53.2", features = ["full"] }
